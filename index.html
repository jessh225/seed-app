// Google Docs Configuration & Helpers
// ============================================
const GOOGLE_CLIENT_ID = ''; // Set your Google Cloud OAuth 2.0 Client ID here
const GOOGLE_DOCS_SCOPE = 'https://www.googleapis.com/auth/documents https://www.googleapis.com/auth/drive.file';

const getGoogleAccessToken = () => {
  return new Promise((resolve, reject) => {
    if (!GOOGLE_CLIENT_ID) {
      reject(new Error('Google Client ID not configured. Set GOOGLE_CLIENT_ID in index.html.'));
      return;
    }
    if (!window.google?.accounts?.oauth2) {
      reject(new Error('Google Identity Services not loaded. Check your internet connection.'));
      return;
    }
    const tokenClient = window.google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: GOOGLE_DOCS_SCOPE,
      callback: (response) => {
        if (response.error) {
          reject(new Error(response.error_description || response.error));
        } else {
          resolve(response.access_token);
        }
      },
    });
    tokenClient.requestAccessToken();
  });
};

const createGoogleDoc = async (title, ideas, projects) => {
  const accessToken = await getGoogleAccessToken();

  // Create the document
  const createRes = await fetch('https://docs.googleapis.com/v1/documents', {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${accessToken}`,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({ title }),
  });

  if (!createRes.ok) {
    const err = await createRes.json();
    throw new Error(err.error?.message || 'Failed to create Google Doc');
  }

  const doc = await createRes.json();
  const documentId = doc.documentId;

  // Build document content
  const requests = [];
  let index = 1;

  // Helper to insert text and advance index
  const insertText = (text, bold = false, fontSize = null) => {
    requests.push({
      insertText: { location: { index }, text }
    });
    const style = {};
    if (bold) style.bold = true;
    if (fontSize) style.fontSize = { magnitude: fontSize, unit: 'PT' };
    if (Object.keys(style).length > 0) {
      requests.push({
        updateTextStyle: {
          range: { startIndex: index, endIndex: index + text.length },
          textStyle: style,
          fields: Object.keys(style).join(',') + (fontSize ? ',fontSize' : ''),
        }
      });
    }
    index += text.length;
  };

  // Title section: Ideas
  if (ideas.length > 0) {
    insertText('Ideas\n', true, 18);
    ideas.forEach((idea) => {
      const line = `• ${idea.text}${idea.date ? ` (${idea.date})` : ''}\n`;
      insertText(line);
      if (idea.notes) {
        insertText(`  ${idea.notes}\n`);
      }
    });
    insertText('\n');
  }

  // Title section: Projects
  if (projects.length > 0) {
    insertText('Projects\n', true, 18);
    projects.forEach((project) => {
      insertText(`${project.name}\n`, true, 14);
      const items = project.items || [];
      if (items.length === 0) {
        insertText('  (no items)\n');
      } else {
        items.forEach((item) => {
          const status = item.done ? '✅' : '⬜';
          const line = `  ${status} ${item.text}${item.date ? ` (${item.date})` : ''}\n`;
          insertText(line);
          if (item.notes) {
            insertText(`    ${item.notes}\n`);
          }
        });
      }
      insertText('\n');
    });
  }

  if (requests.length === 0) {
    insertText('No ideas or projects to export.\n');
  }

  // Apply content to the document
  await fetch(`https://docs.googleapis.com/v1/documents/${documentId}:batchUpdate`, {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${accessToken}`,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({ requests }),
  });

  return { documentId, url: `https://docs.google.com/document/d/${documentId}/edit` };
};

const LoginScreen = ({ onLogin }) => {
  const [step, setStep] = useState('choose'); // 'choose', 'login', 'signup', 'forgot', 'reset-password'
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [confirmPassword, setConfirmPassword] = useState('');
  const [loading, setLoading] = useState(false);
  const [message, setMessage] = useState('');
  const [messageType, setMessageType] = useState('error');
  const [newPassword, setNewPassword] = useState('');
  const [confirmNewPassword, setConfirmNewPassword] = useState('');
  
  // Check for password reset token in URL
  useEffect(() => {
    const hashParams = new URLSearchParams(window.location.hash.substring(1));
    const type = hashParams.get('type');
    const accessToken = hashParams.get('access_token');
    const queryParams = new URLSearchParams(window.location.search);
    const code = queryParams.get('code');
    
    if (type === 'recovery' && accessToken) {
      setStep('reset-password');
      setMessage('请设置新密码');
      setMessageType('success');
      window.history.replaceState(null, '', window.location.pathname);
    } else if (code) {
      supabase.auth.exchangeCodeForSession(code).then(({ data, error }) => {
        if (!error && data?.session) {
          const isRecovery = data.session.user?.recovery_sent_at;
          if (isRecovery) {
            setStep('reset-password');
            setMessage('请设置新密码');
            setMessageType('success');
          }
        }
        window.history.replaceState(null, '', window.location.pathname);
      });
    }
  }, []);
  
  // Check for pre-filled email
  useEffect(() => {
    const prefillEmail = localStorage.getItem('seed-prefill-email');
    if (prefillEmail) {
      setEmail(prefillEmail);
      setStep('login');
      localStorage.removeItem('seed-prefill-email');
    }
  }, []);
  
  const handleGuestLogin = () => {
    // 使用本地游客模式，数据存储在 localStorage
    const guestUser = {
      id: 'local-guest-' + Date.now(),
      is_anonymous: true,
      is_local_guest: true
    };
    localStorage.setItem('seed-local-guest', JSON.stringify(guestUser));
    window.location.reload();
  };
  
  const handleLogin = async (e) => {
    e.preventDefault();
    if (!email.trim() || !password) {
      setMessage('请填写邮箱和密码');
      setMessageType('error');
      return;
    }
    
    setLoading(true);
    setMessage('');
    
    try {
      const { data, error } = await supabase.auth.signInWithPassword({
        email: email.trim(),
        password: password
      });
      
      if (error) {
        if (error.message.includes('Invalid login')) {
          setMessage('邮箱或密码错误');
        } else {
          setMessage('登录失败: ' + error.message);
        }
        setMessageType('error');
      }
    } catch (err) {
      setMessage('网络错误，请重试');
      setMessageType('error');
    }
    setLoading(false);
  };
  
  const handleSignup = async (e) => {
    e.preventDefault();
    if (!email.trim() || !password || !confirmPassword) {
      setMessage('请填写所有字段');
      setMessageType('error');
      return;
    }
    if (password !== confirmPassword) {
      setMessage('两次密码不一致');
      setMessageType('error');
      return;
    }
    if (password.length < 6) {
      setMessage('密码至少6位');
      setMessageType('error');
      return;
    }
    
    setLoading(true);
    setMessage('');
    
    try {
      const { data, error } = await supabase.auth.signUp({
        email: email.trim(),
        password: password,
        options: { emailRedirectTo: window.location.origin }
      });
      
      if (error) {
        if (error.message.includes('already registered')) {
          setMessage('此邮箱已注册，请登录');
        } else {
          setMessage('注册失败: ' + error.message);
        }
        setMessageType('error');
        setLoading(false);
        return;
      }
      
      if (data?.session) {
        setMessage('✅ 注册成功！正在登录...');
        setMessageType('success');
      } else if (data?.user) {
        setMessage('✅ 账号已创建！请查看邮箱确认后登录');
        setMessageType('success');
        setTimeout(() => {
          setStep('login');
          setMessage('请输入密码登录');
          setMessageType('error');
        }, 3000);
      }
    } catch (err) {
      setMessage('网络错误，请重试');
      setMessageType('error');
    }
    setLoading(false);
  };
  
  const handleForgotPassword = async (e) => {
    e.preventDefault();
    if (!email.trim()) return;
    
    setLoading(true);
    setMessage('');
    
    const { error } = await supabase.auth.resetPasswordForEmail(email.trim(), {
      redirectTo: window.location.origin
    });
    
    if (error) {
      setMessage('发送失败，请重试');
      setMessageType('error');
    } else {
      setMessage('✅ 重置邮件已发送，请查看邮箱');
      setMessageType('success');
    }
    setLoading(false);
  };
  
  const handleResetPassword = async (e) => {
    e.preventDefault();
    if (!newPassword || !confirmNewPassword) {
      setMessage('请填写新密码');
      setMessageType('error');
      return;
    }
    if (newPassword !== confirmNewPassword) {
      setMessage('两次密码不一致');
      setMessageType('error');
      return;
    }
    if (newPassword.length < 6) {
      setMessage('密码至少6位');
      setMessageType('error');
      return;
    }
    
    setLoading(true);
    setMessage('');
    
    try {
      const { error } = await supabase.auth.updateUser({ password: newPassword });
      if (error) {
        setMessage('重置失败: ' + error.message);
        setMessageType('error');
      } else {
        setMessage('✅ 密码已重置！正在登录...');
        setMessageType('success');
        setTimeout(() => window.location.reload(), 1500);
      }
    } catch (err) {
      setMessage('网络错误，请重试');
      setMessageType('error');
    }
    setLoading(false);
  };
  
  const resetForm = () => {
    setPassword('');
    setConfirmPassword('');
    setMessage('');
  };
  
  return (
    <div className="min-h-screen bg-slate-900 flex items-center justify-center p-6">
      <div className="bg-slate-800 rounded-2xl shadow-xl p-8 w-full max-w-sm border border-slate-700 animate-fade-in">
        <div className="text-center mb-8">
          <div className="text-5xl mb-3">🌱</div>
          <h1 className="text-2xl font-semibold text-white">Seed</h1>
          <p className="text-slate-400 text-sm mt-1">Seeds → Projects → Reality</p>
        </div>
        
        {step === 'choose' && (
          <>
            <button
              onClick={() => { setStep('login'); resetForm(); }}
              className="w-full py-4 rounded-xl bg-emerald-600 text-white font-medium hover:bg-emerald-500 transition-colors mb-3"
            >
              登录
            </button>
            <button
              onClick={() => { setStep('signup'); resetForm(); }}
              className="w-full py-4 rounded-xl bg-slate-700 text-white font-medium hover:bg-slate-600 transition-colors mb-3"
            >
              注册账号
            </button>
            <div className="relative my-4">
              <div className="absolute inset-0 flex items-center">
                <div className="w-full border-t border-slate-600"></div>
              </div>
              <div className="relative flex justify-center">
                <span className="px-3 bg-slate-800 text-slate-500 text-sm">或</span>
              </div>
            </div>
            <button
              onClick={handleGuestLogin}
              disabled={loading}
              className="w-full py-3 rounded-xl border border-slate-600 text-slate-400 hover:bg-slate-700 hover:text-white transition-colors disabled:opacity-50"
            >
              {loading ? '进入中...' : '游客模式 (数据仅存本地)'}
            </button>
          </>
        )}
        
        {step === 'login' && (
          <form onSubmit={handleLogin}>
            <input
              type="email"
              value={email}
              onChange={(e) => setEmail(e.target.value)}
              placeholder="邮箱"
              className="w-full px-4 py-3 rounded-xl bg-slate-700 text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 mb-3"
              autoFocus
            />
            <input
              type="password"
              value={password}
              onChange={(e) => setPassword(e.target.value)}
              placeholder="密码"
              className="w-full px-4 py-3 rounded-xl bg-slate-700 text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 mb-4"
            />
            <button
              type="submit"
              disabled={loading}
              className="w-full py-4 rounded-xl bg-emerald-600 text-white font-medium hover:bg-emerald-500 transition-colors disabled:opacity-50 mb-3"
            >
              {loading ? '登录中...' : '登录'}
            </button>
            <div className="flex justify-between">
              <button type="button" onClick={() => { setStep('choose'); resetForm(); }} className="text-slate-400 text-sm hover:text-white">
                ← 返回
              </button>
              <button type="button" onClick={() => { setStep('forgot'); setMessage(''); }} className="text-slate-400 text-sm hover:text-white">
                忘记密码?
              </button>
            </div>
          </form>
        )}
        
        {step === 'signup' && (
          <form onSubmit={handleSignup}>
            <input
              type="email"
              value={email}
              onChange={(e) => setEmail(e.target.value)}
              placeholder="邮箱"
              className="w-full px-4 py-3 rounded-xl bg-slate-700 text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 mb-3"
              autoFocus
            />
            <input
              type="password"
              value={password}
              onChange={(e) => setPassword(e.target.value)}
              placeholder="密码 (至少6位)"
              className="w-full px-4 py-3 rounded-xl bg-slate-700 text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 mb-3"
            />
            <input
              type="password"
              value={confirmPassword}
              onChange={(e) => setConfirmPassword(e.target.value)}
              placeholder="确认密码"
              className="w-full px-4 py-3 rounded-xl bg-slate-700 text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 mb-4"
            />
            <button
              type="submit"
              disabled={loading}
              className="w-full py-4 rounded-xl bg-emerald-600 text-white font-medium hover:bg-emerald-500 transition-colors disabled:opacity-50 mb-3"
            >
              {loading ? '注册中...' : '注册'}
            </button>
            <button type="button" onClick={() => { setStep('choose'); resetForm(); }} className="w-full text-slate-400 text-sm hover:text-white">
              ← 返回
            </button>
          </form>
        )}
        
        {step === 'forgot' && (
          <form onSubmit={handleForgotPassword}>
            <p className="text-slate-400 text-sm mb-4 text-center">输入邮箱，我们会发送重置链接</p>
            <input
              type="email"
              value={email}
              onChange={(e) => setEmail(e.target.value)}
              placeholder="邮箱"
              className="w-full px-4 py-3 rounded-xl bg-slate-700 text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 mb-4"
              autoFocus
            />
            <button
              type="submit"
              disabled={loading}
              className="w-full py-4 rounded-xl bg-emerald-600 text-white font-medium hover:bg-emerald-500 transition-colors disabled:opacity-50 mb-3"
            >
              {loading ? '发送中...' : '发送重置邮件'}
            </button>
            <button type="button" onClick={() => { setStep('login'); setMessage(''); }} className="w-full text-slate-400 text-sm hover:text-white">
              ← 返回登录
            </button>
          </form>
        )}
        
        {step === 'reset-password' && (
          <form onSubmit={handleResetPassword}>
            <input
              type="password"
              value={newPassword}
              onChange={(e) => setNewPassword(e.target.value)}
              placeholder="新密码 (至少6位)"
              className="w-full px-4 py-3 rounded-xl bg-slate-700 text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 mb-3"
              autoFocus
            />
            <input
              type="password"
              value={confirmNewPassword}
              onChange={(e) => setConfirmNewPassword(e.target.value)}
              placeholder="确认新密码"
              className="w-full px-4 py-3 rounded-xl bg-slate-700 text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 mb-4"
            />
            <button
              type="submit"
              disabled={loading}
              className="w-full py-4 rounded-xl bg-emerald-600 text-white font-medium hover:bg-emerald-500 transition-colors disabled:opacity-50"
            >
              {loading ? '重置中...' : '重置密码'}
            </button>
          </form>
        )}
        
        {message && (
          <div className={`mt-4 p-3 rounded-lg text-sm text-center whitespace-pre-wrap ${
            messageType === 'error' ? 'bg-red-500/20 text-red-300' : 'bg-emerald-500/20 text-emerald-300'
          }`}>
            {message}
          </div>
        )}
      </div>
    </div>
  );
};

    const days = [];
    for (let i = 0; i < firstDay.getDay(); i++) days.push(null);
    for (let i = 1; i <= lastDay.getDate(); i++) days.push(new Date(year, month, i));

  // Upgrade anonymous account
  const handleUpgradeAccount = async (e) => {
    e.preventDefault();
    if (!upgradeEmail.trim() || !upgradePassword || !upgradeConfirmPassword) {
      setUpgradeMessage('请填写所有字段');
      setUpgradeMessageType('error');
      return;
    }
    if (upgradePassword !== upgradeConfirmPassword) {
      setUpgradeMessage('两次密码不一致');
      setUpgradeMessageType('error');
      return;
    }
    if (upgradePassword.length < 6) {
      setUpgradeMessage('密码至少6位');
      setUpgradeMessageType('error');
      return;
    }
    
    setUpgradeLoading(true);
    setUpgradeMessage('');
    
    try {
      const oldUserId = user?.id;
      
      // Fetch current data
      const { data: oldIdeas } = await supabase.from('ideas').select('*').eq('user_id', oldUserId);
      const { data: oldProjects } = await supabase.from('projects').select('*').eq('user_id', oldUserId);
      const { data: oldItems } = await supabase.from('project_items').select('*').eq('user_id', oldUserId);
      
      // Sign out anonymous
      await supabase.auth.signOut();
      
      // Create new account
      const { data: signUpData, error: signUpError } = await supabase.auth.signUp({
        email: upgradeEmail.trim(),
        password: upgradePassword
      });
      
      if (signUpError) {
        if (signUpError.message.includes('already registered')) {
          setUpgradeMessage('此邮箱已注册，请直接登录');
          localStorage.setItem('seed-prefill-email', upgradeEmail.trim());
        } else {
          setUpgradeMessage('失败: ' + signUpError.message);
        }
        setUpgradeMessageType('error');
        setUpgradeLoading(false);
        setTimeout(() => window.location.reload(), 2000);
        return;
      }
      
      const newUserId = signUpData?.user?.id;
      
      // If we have a session, migrate data
      if (signUpData?.session && newUserId) {
        // Migrate ideas
        if (oldIdeas?.length) {
          for (const idea of oldIdeas) {
            await supabase.from('ideas').insert({
              text: idea.text,
              notes: idea.notes,
              date: idea.date,
              user_id: newUserId
            });
          }
        }
        
        // Migrate projects and items
        if (oldProjects?.length) {
          for (const project of oldProjects) {
            const { data: newProject } = await supabase.from('projects').insert({
              name: project.name,
              color: project.color,
              user_id: newUserId
            }).select().single();
            
            if (newProject) {
              const projectItems = oldItems?.filter(i => i.project_id === project.id) || [];
              for (const item of projectItems) {
                await supabase.from('project_items').insert({
                  project_id: newProject.id,
                  text: item.text,
                  notes: item.notes,
                  date: item.date,
                  done: item.done,
                  user_id: newUserId
                });
              }
            }
          }
        }
        
        setUpgradeMessage('✅ 账号创建成功！数据已同步');
        setUpgradeMessageType('success');
        setTimeout(() => window.location.reload(), 1500);
      } else {
        setUpgradeMessage('✅ 账号已创建！请查看邮箱确认后登录');
        setUpgradeMessageType('success');
        localStorage.setItem('seed-prefill-email', upgradeEmail.trim());
        setTimeout(() => window.location.reload(), 3000);
      }
    } catch (err) {
      setUpgradeMessage('错误: ' + err.message);
      setUpgradeMessageType('error');
    }
    setUpgradeLoading(false);
  };

                onChange={(date) => {

                  else updateItem(detailView.projectId, detailView.id, { date });

            <div className="flex-1 flex flex-col p-4 overflow-hidden">

                      onChange={() => updateItem(detailView.projectId, detailView.id, { done: !detailItem.done })}

                <textarea

                    else updateItem(detailView.projectId, detailView.id, { text: e.target.value });

                  className={`flex-1 text-base font-medium bg-transparent focus:outline-none resize-none ${detailItem.done ? 'line-through text-slate-400' : 'text-slate-800'}`}
                  placeholder="Title..."
                  style={{ fieldSizing: 'content' }}
                />
              </div>

              <textarea
                value={detailItem.notes || ''}
                onChange={(e) => {
                  if (detailView.type === 'idea') updateIdea(detailView.id, { notes: e.target.value });
                  else updateItem(detailView.projectId, detailView.id, { notes: e.target.value });

                placeholder="Add more details..."
                className="flex-1 w-full text-sm text-slate-600 bg-slate-50 rounded-xl p-4 focus:outline-none resize-none whitespace-pre-wrap"

                <button

                  <span>Delete</span>

            </div>

                          isToday ? 'bg-slate-100 ring-2 ring-slate-300' : 
                          items.length > 0 ? 'bg-slate-50 hover:bg-slate-100' : 'hover:bg-slate-50'
                        }`}
                      >
                        <span className={`text-xs ${isSelected ? 'text-white font-bold' : isToday ? 'font-bold text-slate-800' : 'text-slate-600'}`}>

                          <div className="flex gap-0.5 mt-0.5">

                            ))}
                          </div>

// ============================================
// Root App with Auth
// ============================================
const App = () => {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);
  const [showPasswordReset, setShowPasswordReset] = useState(false);

  useEffect(() => {
    // 清除 URL 中的参数
    const cleanUrl = () => {
      if (window.location.hash || window.location.search) {
        window.history.replaceState(null, '', window.location.pathname);
      }
    };

    // 监听认证状态变化 - 这是处理密码重置的关键
    const { data: { subscription } } = supabase.auth.onAuthStateChange((event, session) => {
      console.log('Auth event:', event);
      
      if (event === 'PASSWORD_RECOVERY') {
        // 密码重置链接被点击
        localStorage.removeItem('seed-local-guest');
        setUser(session?.user);
        setShowPasswordReset(true);
        setLoading(false);
        cleanUrl();
        return;
      }
      
      if (event === 'SIGNED_IN' && session?.user) {
        // 如果有本地游客，不更新（除非是密码恢复）
        if (!localStorage.getItem('seed-local-guest')) {
          setUser(session.user);
        }
      }
    });

    // 初始化：检查当前会话
    const initAuth = async () => {
      // 检查 URL 是否有 recovery 参数
      const hashParams = new URLSearchParams(window.location.hash.substring(1));
      const type = hashParams.get('type');
      const hashType = hashParams.get('type');
      const queryParams = new URLSearchParams(window.location.search);
      const code = queryParams.get('code');
      const queryType = queryParams.get('type');
      
      const tokenHash = queryParams.get('token_hash');
      const errorDescription = queryParams.get('error_description');
      
      // 调试信息
      console.log('URL Debug:', {
        hash: window.location.hash,
        search: window.location.search,
        hashType,
        queryType,
        code: code ? 'exists' : 'none',
        tokenHash: tokenHash ? 'exists' : 'none'
      });
      
      // 如果有 token_hash 和 type=recovery，这是邮件重置链接
      if (tokenHash && queryType === 'recovery') {
        console.log('Token hash recovery detected');
        localStorage.removeItem('seed-local-guest');
        // Supabase 会自动处理 token_hash，我们只需要等待 session
        const { data: { session }, error } = await supabase.auth.getSession();
        if (session?.user) {
          setUser(session.user);
          setShowPasswordReset(true);
          cleanUrl();
          setLoading(false);
          return;
        } else {
          // 尝试验证 token
          const { data, error } = await supabase.auth.verifyOtp({
            token_hash: tokenHash,
            type: 'recovery'
          });
          if (!error && data?.session) {
            setUser(data.session.user);
            setShowPasswordReset(true);
            cleanUrl();
            setLoading(false);
            return;
          }
          console.error('Token verification error:', error);
        }
      }
      
      // 如果有 code 参数，让 Supabase 处理
      if (code) {
        console.log('Processing code parameter...');
        localStorage.removeItem('seed-local-guest');
        try {
          const { data, error } = await supabase.auth.exchangeCodeForSession(code);
          console.log('Code exchange result:', { data: data ? 'success' : 'null', error });
          if (!error && data?.session) {
            setUser(data.session.user);
            // 检查 URL 是否包含 recovery 类型
            if (queryType === 'recovery' || hashType === 'recovery') {
              console.log('Recovery type detected, showing reset modal');
              setShowPasswordReset(true);
            }
          } else if (error) {
            console.error('Code exchange error:', error);
          }
          cleanUrl();
          setLoading(false);
          return;
        } catch (e) {
          console.error('Code exchange exception:', e);
        }
      }
      
      // 如果 hash 有 recovery type
      if (type === 'recovery') {
        localStorage.removeItem('seed-local-guest');
        // 让 Supabase 自动处理 hash 中的 token
        const { data: { session } } = await supabase.auth.getSession();
        if (session?.user) {
          setUser(session.user);
          setShowPasswordReset(true);
          cleanUrl();
          setLoading(false);
          return;
        }
      }

      // 先检查本地游客
      const localGuest = localStorage.getItem('seed-local-guest');
      if (localGuest) {
        try {
          setUser(JSON.parse(localGuest));
          setLoading(false);
          return;
        } catch (e) {
          localStorage.removeItem('seed-local-guest');
        }
      }

      // Check current Supabase session
      const { data: { session } } = await supabase.auth.getSession();
      if (session?.user) {
        // 已登录用户
        setUser(session.user);
      } else {
        // 没有登录，自动创建本地游客
        const guestUser = {
          id: 'local-guest-' + Date.now(),
          is_anonymous: true,
          is_local_guest: true
        };
        localStorage.setItem('seed-local-guest', JSON.stringify(guestUser));
        setUser(guestUser);
      }
      setLoading(false);
    };

    initAuth();

    return () => subscription.unsubscribe();
  }, []);

  // Register service worker
  useEffect(() => {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(console.error);
    }
  }, []);

  if (loading) {
    return (
      <div className="min-h-screen bg-slate-900 flex items-center justify-center">
        <div className="text-5xl">🌱</div>
      </div>
    );
  }

  return <SeedApp user={user} initialShowPasswordReset={showPasswordReset} />;
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
